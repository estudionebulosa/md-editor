<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Editor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    
    markdown-editor {
      display: block;
      width: 100%;
      min-height: 600px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 Markdown Editor</h1>
    <markdown-editor id="editor"></markdown-editor>
  </div>
  
  <script type="module" src="./src/editor.js"></script>
  <script>
    const editor = document.getElementById('editor');
    
    // Cargar contenido de ejemplo
    editor.load({
      content: `# Bienvenido al Editor de Markdown

Este es un **editor de Markdown** completo con soporte para:

## Características

- ✅ Modo código y vista previa
- ✅ Temas claro y oscuro
- ✅ Exportar a HTML, PDF y Markdown
- ✅ Tags y slugs
- ✅ Imágenes inline (base64)

## Ejemplo de Código

\`\`\`javascript
function hello() {
  console.log('Hello, World!');
}
\`\`\`

## Tabla de Ejemplo

| Característica | Estado |
|---------------|--------|
| Dual Mode | ✅ |
| Themes | ✅ |
| Export | ✅ |

> [!tip]
> Puedes arrastrar y soltar imágenes directamente en el editor.

## Preguntas Frecuentes

::: faq
### ¿Qué es esto?
Un editor de Markdown basado en Web Components.

### ¿Cómo lo uso?
Simplemente escribe Markdown y cambia entre modo código y vista previa.
:::

Más información en la [documentación](https://github.com/estudionebulosa/nebulosa).
`,
      path: 'ejemplo.md',
      frontmatter: {
        title: 'Ejemplo de Markdown',
        tags: ['markdown', 'editor', 'web-components'],
        slug: 'ejemplo-markdown'
      }
    });
    
    // Escuchar eventos
    editor.addEventListener('save', (e) => {
      console.log('Contenido guardado:', e.detail);
    });
    
    editor.addEventListener('change', (e) => {
      console.log('Contenido modificado:', e.detail.dirty);
    });
  </script>
</body>
</html>

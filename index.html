<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Editor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    
    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }
    
    markdown-editor {
      display: block;
      width: 100%;
      min-height: 600px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📝 Markdown Editor</h1>
    <markdown-editor id="editor"></markdown-editor>
  </div>
  
  <script type="module" src="./src/editor.js"></script>
  <script>
    const editor = document.getElementById('editor');
    
    // Cargar automáticamente el archivo de ejemplo al inicio
    setTimeout(() => {
      editor.loadFileFromRepo('./content/ejemplo-completo.md');
    }, 500);
    
    // Escuchar eventos
    editor.addEventListener('save', (e) => {
      console.log('Contenido guardado:', e.detail);
    });
    
    editor.addEventListener('change', (e) => {
      console.log('Contenido modificado:', e.detail.dirty);
    });
    
    editor.addEventListener('file-loaded', (e) => {
      console.log('Archivo cargado:', e.detail.path);
    });
  </script>
</body>
</html>
